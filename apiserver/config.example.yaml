mounts:
  - ./downloads
  - ./stored
downloads: ./downloads
media:
  # mandatory media entries:
  # movies, tvshows
  audiobooks:
    directory: ./stored/audiobooks
    exts:
      - mp3
      - m4a
  books:
    directory: ./stored/books
    exts:
      - epub
      - pdf
      - zip
  movies:
    # wrap a video file into a folder
    # (folder named as the video filename without extension)
    wrap: true
    directory: ./stored/movies
    exts:
      - mp4
      - mkv
      - avi
      - webm
  music:
    directory: ./stored/music
    exts:
      - mp3
      - m4a
      - ogg
      - flac
      - wav
  software:
    directory: ./stored/software
    exts:
      - zip
      - msi
      - exe
      - 7z
  tvshows:
    directory: ./stored/tv-shows
    exts:
      - mp4
      - mkv
      - avi
      - webm
transmission:
  port: 9091
  host: 10.0.0.2
external_links:
  - name: External Link
    href: https://example.com
valid_extensions:
  - .txt
  - .md
  - .mp3
  - .mp4
  - .mkv
  - .zip
  - .pdf
filters:
  words:
    - YIFY
    - BluRay
    - BRip
    - BrRip
    - DVDRip
    - TVRip
    - x264
    - x265
    - 1080p
    - 720p
    - HEVC
    - DC
    - 10bit
    - 10bi
    - DSNP
    - REPACK
    - DDP5.1
    - xxx
    - AAC
    - AMZN
    - Tigole
    - successfulcrab
    - WebRip
images: /path/to/wallpapers/
source_site: https://tpb.party
