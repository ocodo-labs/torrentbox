[package]
name = "torrentbox_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "test-util",
] }
reqwest = { version = "0.12", features = [
    "json"
] }
serde = { version = "1", features = [
    "derive"
] }
serde-saphyr = "1.3.0"
serde_json = "1"
utoipa = { version = "5", features = [
    "axum_extras"
] }
tower-http = { version = "0.6", features = [
    "fs"
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter"
] }

[dev-dependencies]
tower = { version = "0.5", features = [
    "util"
] }
http-body-util = "0.1"
bytes = "1"

[[bin]]
name = "torrentbox_server"
path = "src/main.rs"
